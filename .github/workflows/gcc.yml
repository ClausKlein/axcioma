name: GCC-15/16

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 6'

jobs:
  gcc:
    strategy:
      fail-fast: false
      matrix:
        version: [15, 16]

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/mattkretz/cplusplus-ci/gcc${{ matrix.version }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      #     cache: 'pip' # caching pip dependencies
      # FIXME: - run: pip install -r requirements.txt
      # see https://github.com/actions/setup-python/blob/main/docs/advanced-usage.md#using-the-pip-install-input

      # TODO(CK): not needed!
      # - name: Setup Cpp
      #   uses: aminya/setup-cpp@v1
      #   with:
      #     cmake: 4.1.2
      #     ninja: 1.13.0
      #     gcovr: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4

      - name: Install symlinks
        run: |
          apt-get update -q
          apt-get install -q -y symlinks # XXX python-is-python3

      - name: Install Python modules via pip
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Run test suite
        env:
          CC: gcc
          CXX: g++
          PATH: $HOME/.local/bin:$PATH
        run: |
          . .venv/bin/activate
          ./build-taox11-on-linux.sh
